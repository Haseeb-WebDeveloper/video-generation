name: Render & schedule videos

# Free cloud rendering + scheduled YouTube publishing for the ranking channel.
# Each episode renders on its own parallel runner, off your PC. On a PUBLIC repo
# this uses unlimited free Linux minutes.
#
# Trigger: Actions → "Render & schedule videos" → Run workflow.
# With the defaults it renders all 10 country videos (flow template) and, if
# publish=true, uploads them to YouTube as PRIVATE + scheduled — the first goes
# live at `start`, then one every `every_days` days (default 2 = "post today,
# skip a day, post, …"). You just click Run.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated episode slugs (order = publish order)"
        required: true
        default: "most-nuclear-weapons,highest-military-spending,most-guns-per-person,most-prisoners-per-capita,highest-national-debt,most-gold-reserves,most-foreign-reserves,most-remittances,most-visited-countries,most-oil-reserves"
      variant:
        description: "Template"
        type: choice
        options:
          - flow
          - bars
          - race
        default: flow
      publish:
        description: "Upload to YouTube (private + scheduled). Off = render only."
        type: boolean
        default: false
      start:
        description: "First publish time, UTC ISO (e.g. 2026-06-07T16:00:00Z). Required if publish=true and must be in the future."
        required: false
        default: ""
      every_days:
        description: "Days between releases (2 = one video, skip a day, next video)"
        required: false
        default: "2"

jobs:
  # Build a JSON matrix of { slug, index } so each render job knows its position
  # in the publish order (used to compute its staggered publishAt).
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          json=$(printf '%s' "${{ github.event.inputs.slugs }}" \
            | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . \
            | jq -R . | jq -cs '[to_entries[] | {slug: .value, index: .key}]')
          echo "matrix={\"include\":$json}" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Headless-Chrome / WebGL system libraries Remotion needs on Linux.
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - run: npm ci

      # Race template needs a baked sim; flow/bars don't. Covers/flags and the
      # generated voiceover clips are all committed, so nothing to fetch.
      - name: Bake physics (race only)
        if: ${{ inputs.variant == 'race' }}
        run: node scripts/race-roll.mjs ${{ matrix.slug }} --keep

      # GPU-less runners use SwiftShader software GL (--gl=swangle). The
      # committed voiceover manifest drives duration + camera; the ffmpeg
      # narration/music mux runs after render (same as local).
      - name: Render
        run: |
          mkdir -p out
          npx remotion render ${{ matrix.slug }}-${{ inputs.variant }} \
            out/${{ matrix.slug }}-${{ inputs.variant }}.mp4 \
            --concurrency=2 --timeout=300000 --gl=swangle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-${{ inputs.variant }}-mp4
          path: out/${{ matrix.slug }}-${{ inputs.variant }}.mp4
          retention-days: 14

      # Compute this episode's scheduled release: start + index * every_days.
      # Each parallel job uses its own matrix.index, so the batch staggers
      # without any shared state.
      - name: Compute publishAt
        if: ${{ inputs.publish }}
        id: when
        run: |
          START="${{ inputs.start }}"
          if [ -z "$START" ]; then
            echo "::error::publish=true requires a 'start' UTC ISO time (e.g. 2026-06-07T16:00:00Z)."
            exit 1
          fi
          EVERY="${{ inputs.every_days }}"
          OFFSET=$(( ${{ matrix.index }} * EVERY * 86400 ))
          BASE=$(date -u -d "$START" +%s) || { echo "::error::Invalid start time '$START'"; exit 1; }
          WHEN=$(date -u -d "@$(( BASE + OFFSET ))" +%Y-%m-%dT%H:%M:%SZ)
          echo "publishAt=$WHEN" >> "$GITHUB_OUTPUT"
          echo "Episode #${{ matrix.index }} (${{ matrix.slug }}) → $WHEN"

      # Scheduled upload to YouTube. Requires the 3 secrets in repo Settings.
      - name: Publish to YouTube (scheduled)
        if: ${{ inputs.publish }}
        env:
          YT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_ID" ] || [ -z "$YT_SECRET" ] || [ -z "$YT_REFRESH" ]; then
            echo "::error::Missing YouTube secrets (YOUTUBE_CLIENT_ID/SECRET/REFRESH_TOKEN)."
            exit 1
          fi
          printf 'YOUTUBE_CLIENT_ID=%s\nYOUTUBE_CLIENT_SECRET=%s\nYOUTUBE_REFRESH_TOKEN=%s\n' \
            "$YT_ID" "$YT_SECRET" "$YT_REFRESH" > .env
          node scripts/publish-episode.mjs ${{ matrix.slug }}-${{ inputs.variant }} \
            --publish-at=${{ steps.when.outputs.publishAt }}
          rm -f .env
